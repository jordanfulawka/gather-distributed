services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather
      POSTGRES_DB: gather
    ports:
      - '5432:5432'
    volumes:
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  server-a:
    build:
      context: .
      dockerfile: apps/chat-server/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://gather:gather@postgres:5432/gather
      REDIS_URL: redis://:gather@redis:6379
      JWT_SECRET: dev-secret-change-me
      PORT: 3001
      SERVER_ID: 'server-a'
    depends_on:
      - postgres
      - redis

  server-b:
    build:
      context: .
      dockerfile: apps/chat-server/Dockerfile
    ports:
      - '3002:3001'
    environment:
      DATABASE_URL: postgres://gather:gather@postgres:5432/gather
      REDIS_URL: redis://:gather@redis:6379
      JWT_SECRET: dev-secret-change-me
      PORT: 3001
      SERVER_ID: 'server-b'
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:80
    ports:
      - '3000:3000'
    depends_on:
      - nginx

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --requirepass gather --appendonly yes
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - server-a
      - server-b

volumes:
  postgres_data:
  redis-data:
