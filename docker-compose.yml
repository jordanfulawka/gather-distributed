services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather
      POSTGRES_DB: gather
    ports:
      - '5432:5432'
    volumes:
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
