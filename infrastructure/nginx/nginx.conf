events {}

http {
  upstream chat_servers {
    ip_hash;
    server server-a:3001;
    server server-b:3001;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name gather-chat.dev www.gather-chat.dev;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name gather-chat.dev www.gather-chat.dev;

    ssl_certificate /etc/letsencrypt/live/gather-chat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gather-chat.dev/privkey.pem;

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://chat_servers;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
      proxy_pass http://chat_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}