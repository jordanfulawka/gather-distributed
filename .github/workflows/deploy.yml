name: Deploy
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.VPS_HOST}}
          username: root
          key: ${{secrets.VPS_SSH_KEY}}
          script: |
            cd ~/gather-distributed
            docker-compose down
            git pull
            docker-compose up --build -d
